<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dde8"/><stop offset="1" stop-color="#9aa7bb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#2a2025"/>
  <g transform="rotate(-8 256 280)">
    <!-- hotel-style do-not-disturb hanger card -->
    <rect x="146" y="112" width="220" height="330" rx="28" fill="#f5efdf" stroke="#cbbf9c" stroke-width="4"/>
    <circle cx="256" cy="152" r="26" fill="#2a2025" stroke="#cbbf9c" stroke-width="6"/>
    <!-- shushing robot face -->
    <circle cx="256" cy="268" r="64" fill="url(#gF)"/>
    <rect x="250" y="188" width="12" height="20" rx="6" fill="#8892a4"/>
    <circle cx="256" cy="182" r="9" fill="#ffb454"/>
    <path d="M222 258 q10 -14 20 0" fill="none" stroke="#101623" stroke-width="6" stroke-linecap="round"/>
    <path d="M270 258 q10 -14 20 0" fill="none" stroke="#101623" stroke-width="6" stroke-linecap="round"/>
    <!-- finger over the mouth: pssst -->
    <ellipse cx="256" cy="304" rx="15" ry="30" fill="#e5ebf5" transform="rotate(-8 256 304)"/>
    <circle cx="258" cy="278" r="11" fill="#eef3fb"/>
    <ellipse cx="206" cy="286" rx="11" ry="6" fill="#f5b8ae" opacity="0.6"/>
    <ellipse cx="306" cy="286" rx="11" ry="6" fill="#f5b8ae" opacity="0.6"/>
    <!-- tiny Away chip sticker on the card -->
    <rect x="220" y="384" width="72" height="30" rx="15" fill="#1b2438"/>
    <circle cx="238" cy="399" r="8" fill="#ffb454"/>
    <rect x="252" y="395" width="28" height="8" rx="4" fill="#eef3fb"/>
  </g>
  <!-- the doorknob it hangs on -->
  <circle cx="240" cy="150" r="19" fill="#d9b25c"/>
  <ellipse cx="234" cy="144" rx="7" ry="5" fill="#f2dfae"/>
</svg>
