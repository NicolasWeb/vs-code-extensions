    <rect x="248" y="302" width="16" height="66" transform="rotate(-120 256 402)"/>
  </g>
  <!-- both paws on the wheel -->
  <circle cx="168" cy="316" r="26" fill="url(#gE)"/>
  <circle cx="344" cy="316" r="26" fill="url(#gE)"/>
  <rect x="150" y="306" width="38" height="16" rx="8" fill="#cfd6e2"/>
  <rect x="324" y="306" width="38" height="16" rx="8" fill="#cfd6e2"/>
