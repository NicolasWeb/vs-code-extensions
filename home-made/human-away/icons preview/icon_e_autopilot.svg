  <rect x="156" y="64" width="200" height="150" rx="34" fill="url(#gE)"/>
  <rect x="136" y="112" width="20" height="54" rx="9" fill="#7c8698"/>
  <rect x="356" y="112" width="20" height="54" rx="9" fill="#7c8698"/>
  <rect x="180" y="96" width="152" height="62" rx="16" fill="#101623"/>
