<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dde8"/><stop offset="1" stop-color="#9aa7bb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#1b2438"/>
  <!-- antenna -->
  <rect x="246" y="42" width="20" height="26" rx="9" fill="#8892a4"/>
  <circle cx="256" cy="34" r="12" fill="#ffb454"/>
