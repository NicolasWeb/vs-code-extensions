    <circle cx="410" cy="392" r="42" fill="none" stroke="#35507e" stroke-width="12"/>
    <g fill="#35507e">
      <rect x="402" y="338" width="16" height="16" rx="4"/>
      <rect x="402" y="430" width="16" height="16" rx="4"/>
      <rect x="356" y="384" width="16" height="16" rx="4"/>
      <rect x="448" y="384" width="16" height="16" rx="4"/>
    </g>
  </g>
  <!-- head with visor -->
  <rect x="136" y="140" width="240" height="160" rx="40" fill="url(#botB)"/>
  <rect x="160" y="172" width="192" height="84" rx="26" fill="#26324b"/>
